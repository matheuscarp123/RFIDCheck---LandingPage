<meta property="og:type" content="website"><meta property="og:title" content="RFIDCheck — Turnstile log analysis, offline"><meta property="og:description" content="Offline desktop system that processes raw RFID & turnstile exports in seconds. Find uncollected overstays, separate municipal subsidies and generate director-ready reports — no internet, no monthly fees.">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FA;--ink:#0D0E12;--line:#EAECEF;--y:#FCD34D;--b:#2563EB;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:500 16px/1.6 'Plus Jakarta Sans',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0}h1,h2,h3{font-weight:800;letter-spacing:-.03em;line-height:1.08}
h1{font-size:clamp(40px,7vw,80px)}h2{font-size:clamp(28px,4.2vw,48px);max-width:760px;margin:0 auto}
.mk{background:var(--y);padding:0 .15em;border-radius:.15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.c{text-align:center}.muted{color:#5b606b}
.pill{display:inline-block;background:var(--y);font-weight:800;font-size:13px;padding:6px 14px;border-radius:99px;margin-bottom:18px}
/* nav */
nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1080px,calc(100% - 24px));z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 20px;background:#fff;border:1px solid var(--line);border-radius:99px;transition:all .5s var(--ease)}
nav.s{background:rgba(255,255,255,.65);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-color:rgba(13,14,18,.08);box-shadow:0 8px 30px rgba(13,14,18,.07)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--ink);position:relative}.logo i:after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--y)}
.links{display:flex;gap:26px;font-size:14px;font-weight:700}.links a:hover{opacity:.6}
.right{display:flex;align-items:center;gap:10px}
.lang{position:relative}.lang>button{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;min-width:170px;box-shadow:0 16px 40px rgba(13,14,18,.12);opacity:0;pointer-events:none;transform:translateY(-6px);transition:.3s var(--ease)}
.lang.o .menu{opacity:1;pointer-events:auto;transform:none}.menu a{display:block;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:700}.menu a:hover,.menu a.on{background:var(--bg)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:12px;border-radius:99px;font-weight:800;font-family:inherit;border:0;cursor:pointer;color:#fff;transition:box-shadow .5s var(--ease);will-change:transform}

.btn.k{background:var(--ink);padding:11px 20px;font-size:14px}
.btn.p{background:var(--b);padding:10px 12px 10px 28px;font-size:18px;box-shadow:0 10px 30px rgba(37,99,235,.3)}
.btn.p:hover{box-shadow:0 16px 40px rgba(37,99,235,.42)}
.btn .ar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--b);display:grid;place-items:center;transition:transform .5s var(--ease)}.btn:hover .ar{transform:translateX(3px)}
/* hero */
.hero{padding-top:150px;text-align:center}.hero h1{max-width:820px;margin:0 auto 24px}
.sub{max-width:640px;margin:0 auto 22px;font-size:18px;color:#3d424d}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}.chips code{background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}
.micro{font-size:13px;margin-top:14px;color:#5b606b}
.frame{max-width:960px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 80px -20px rgba(13,14,18,.2);overflow:hidden;transform:perspective(1000px) rotateX(10deg) scale(.94);transform-origin:center top;will-change:transform}
.bar{display:flex;gap:7px;padding:12px 16px;background:#F1F2F5;border-bottom:1px solid var(--line)}.bar b{width:11px;height:11px;border-radius:50%;background:#d5d8de}.bar b:first-child{background:#ff6b60}.bar b:nth-child(2){background:#fdbc2e}.bar b:nth-child(3){background:#2fc84a}
.vid{position:relative;aspect-ratio:16/9;background:#0D0E12;cursor:pointer;display:block;width:100%;border:0;padding:0;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;background:linear-gradient(135deg,#eef2ff,#fff);display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:24px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;width:76px;height:76px;border-radius:50%;background:var(--b);display:grid;place-items:center;box-shadow:0 12px 40px rgba(37,99,235,.5);transition:transform .5s var(--ease)}.vid:hover .play{transform:scale(1.08)}
.mini{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 22px;text-align:left;min-width:150px}.mini small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#6b7280}.mini strong{font-size:30px;font-weight:800}
/* cards */
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;overflow:hidden;transition:transform .6s var(--ease),box-shadow .6s var(--ease);transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateY(var(--ty,0))}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(360px circle at var(--mx) var(--my),rgba(37,99,235,.10),transparent 60%)}
.card:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;padding:1px;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(37,99,235,.6),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:hover{--ty:-4px;box-shadow:0 24px 50px -12px rgba(13,14,18,.14)}.card:hover:before,.card:hover:after{opacity:1}
.card h3{font-size:22px;margin:18px 0 8px;letter-spacing:-.02em}.card p{color:#4a4f5a;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.drop{border:2px dashed #cdd3dd;border-radius:18px;height:150px;display:grid;place-items:center;background:var(--bg);font-weight:800;color:#6b7280;gap:6px;text-align:center;align-content:center}
.drop span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--ink);animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.stats{display:flex;gap:12px;height:150px;align-items:stretch}.stats div{flex:1;background:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:center}.stats small{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6b7280}.stats strong{font-size:34px;font-weight:800}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.hw h3{margin-top:0;font-size:20px}.hw small{display:block;font-weight:800;font-size:11px;letter-spacing:.08em;color:#6b7280;margin-top:14px}.hw p{font-size:14px;margin-top:2px}
.banner{border:2px solid var(--ink);text-align:center;padding:56px 32px}.banner h2{font-size:clamp(26px,3.6vw,42px);margin-bottom:16px}
.price{max-width:520px;margin:48px auto 0;text-align:left;box-shadow:0 40px 80px -20px rgba(13,14,18,.25);padding:40px}
.badge{position:absolute;top:22px;right:22px;background:var(--y);font-weight:800;font-size:12px;padding:5px 12px;border-radius:99px}
.amt{font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:10px 0 4px}
.price ul{list-style:none;padding:0;margin:24px 0}.price li{padding:9px 0 9px 32px;position:relative;font-size:15px;border-top:1px solid var(--line)}.price li:before{content:"✔";position:absolute;left:0;color:var(--b);font-weight:800}
.price .btn{width:100%;justify-content:center;background:var(--ink);padding:18px;font-size:17px}
footer{padding:30px 0 50px;text-align:center;font-size:13px;color:#6b7280}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease)}.rv.in{opacity:1;transform:none}
@media(max-width:820px){.links{display:none}.g2,.g3{grid-template-columns:1fr}.btn.k{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.frame{transform:none}}

.hero{position:relative;overflow-x:clip}.hero>.wrap{position:relative;z-index:1}
.dms{position:absolute;inset:0;pointer-events:none;z-index:0}
.dm{position:absolute;width:150px;height:150px;pointer-events:auto;animation:fy 6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes fy{50%{transform:translateY(-11px)}}
.dm .pl{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:26px;transform:scaleY(.58) rotate(45deg);box-shadow:7px 7px 0 #ECEEF2,22px 26px 44px rgba(13,14,18,.10)}
.dm .ico{position:absolute;left:50%;top:38%;width:76px;transform:translate(-50%,-50%);transition:transform .6s var(--ease)}.dm:hover .ico{transform:translate(-50%,-60%)}
.tl{left:1%;top:100px;--d:-1s}.ml{left:-3%;top:350px;--d:-3s}.tr{right:1%;top:130px;--d:-2s}.mr{right:-3%;top:350px;--d:-4s}
.fw{position:relative;max-width:960px;margin:56px auto 0}.bc{left:50%;margin-left:-75px;top:-160px;z-index:3;--d:-.5s}
.dm .arm{transition:transform .8s var(--ease)}.dm:hover .arm{transform:rotate(60deg)}
.nfc circle{transform-box:fill-box;transform-origin:center;animation:np 2.4s ease-out infinite}@keyframes np{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.wv{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(-5px)}}
@media(max-width:1199px){.tl,.tr{display:none}}@media(max-width:899px){.ml,.mr{display:none}}
.vis{height:140px;margin-top:20px;border-radius:18px;background:var(--bg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.cnt{font-size:38px;font-weight:800;color:#DC2626;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.chip{font-size:11px;font-weight:800;background:#FEE2E2;color:#B91C1C;border-radius:99px;padding:3px 10px}
.file{position:absolute;left:22px;top:50%;transform:translateY(-50%);z-index:2;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;box-shadow:0 6px 16px rgba(13,14,18,.08)}
.tag{position:absolute;left:62px;top:50%;margin-top:-14px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800;opacity:0;white-space:nowrap;transform:scale(.8);transition:transform .9s var(--ease),opacity .5s}
.tag.a{background:#DBEAFE;color:#1D4ED8}.tag.b{background:#FEF3C7;color:#92400E}
.card:hover .tag.a,.vis.open .tag.a{opacity:1;transform:translate(52px,-28px)}.card:hover .tag.b,.vis.open .tag.b{opacity:1;transform:translate(52px,28px)}
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;padding:0 14px}
.l{height:54px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:12px;color:#6b7280;display:grid;place-items:center;position:relative}
.l.x{border-color:#7F1D1D;background:#FEF2F2;color:#7F1D1D}.l.x svg{position:absolute;top:-7px;right:-7px;width:22px}
.card:hover .l.x{animation:sh .5s}@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.st{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #F3C9C9;color:#7F1D1D;font-size:11px;font-weight:800;border-radius:99px;padding:4px 12px}
.st i{width:7px;height:7px;border-radius:50%;background:#7F1D1D;animation:pu 1.4s infinite}@keyframes pu{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dm,.wv,.nfc circle{animation:none!important}}

.logo{gap:10px}.lg-i{display:block;flex:none}
.cl{right:-4%;top:590px;--d:-5s}@media(max-width:899px){.cl{display:none}}
.lang>button{display:inline-flex;gap:8px;align-items:center}.menu a{display:flex;gap:10px;align-items:center}
.fl{display:inline-block;width:26px;height:18px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px rgba(13,14,18,.12);flex:none;vertical-align:middle}.fl svg{display:block;width:100%;height:100%}
.ch .fl{width:40px;height:27px;border-radius:7px}.ch{display:flex;align-items:center;gap:6px;margin-bottom:6px}.ch>div{margin-left:6px}.ch h3{margin:0!important;font-size:20px!important}.ch small{font-size:12px;color:#6b7280;font-weight:700}
.cc{display:flex;flex-direction:column;gap:10px;padding:24px;background:linear-gradient(180deg,color-mix(in srgb,var(--a) 9%,#fff) 0,#fff 120px)}
.vd{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 8%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff)}
.vd b{display:block;font-size:14px;line-height:1.25}.vd small{display:block;font-size:12px;color:#5b606b;font-weight:600}
.vi{width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.vi.two{flex-direction:column;gap:1px}.vi.two svg{width:13px;height:13px}
.lg{display:flex;gap:22px;justify-content:center;margin-top:22px;font-size:13px;font-weight:700;color:#5b606b}.lg span{display:flex;align-items:center;gap:8px}.lg em{font-style:normal}.lg b{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center}
.cover{flex-direction:column;flex-wrap:nowrap;gap:18px}
.dm-t{position:relative;z-index:1;font-weight:800;font-size:clamp(14px,2vw,18px);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:9px 18px;border-radius:99px;text-align:center;max-width:90%}
.scan{position:relative;overflow:hidden;border-radius:18px}.scan:after{content:"";position:absolute;top:0;bottom:0;left:-70px;width:70px;background:linear-gradient(90deg,transparent,rgba(37,99,235,.14) 70%,rgba(37,99,235,.4));border-right:2px solid rgba(37,99,235,.5);animation:scn 3.8s cubic-bezier(.45,0,.55,1) infinite}@keyframes scn{0%{left:-70px}65%,100%{left:100%}}
.sp{height:176px;display:block}.sp .fi{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:0 6px 16px rgba(13,14,18,.08)}
.sp .bar{position:absolute;left:50%;top:62px;width:64px;height:9px;margin-left:-32px;border-radius:5px;background:#CBD5E1;animation:mv 6s cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--i)*.1s)}
@keyframes mv{0%,14%{transform:translate(0,var(--y0));background:#CBD5E1}42%,84%{transform:translate(var(--tx),var(--ty));background:var(--c)}100%{transform:translate(0,var(--y0));background:#CBD5E1}}
.sp .tg{position:absolute;top:96px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap;opacity:0;animation:tg 6s infinite;transform:translateX(-50%)}.sp .tg.a{left:calc(50% - 72px);background:#DBEAFE;color:#1D4ED8}.sp .tg.b{left:calc(50% + 72px);background:#FEF3C7;color:#92400E}
@keyframes tg{0%,36%{opacity:0}46%,84%{opacity:1}96%,100%{opacity:0}}
.lkv{flex-direction:row;gap:8px;padding:0 12px}.wb{width:112px;flex:none;filter:drop-shadow(0 10px 14px rgba(127,29,29,.3));animation:fy 6s ease-in-out infinite}.lkc{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}.lk3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}.lk3 .l{height:44px;font-size:11px}.l.x{animation:pu 1.8s infinite}
.dkw{padding:40px 0}.dk{position:relative;background:#0D0E12;color:#fff;border-radius:40px;overflow:hidden;padding:80px 40px}.dk h2{color:#fff}.dk p{color:#a5aab6}
.bl{position:absolute;top:-85px;width:170px;height:170px;border-radius:50%;background:#1a1b20}.bl.l{left:-30px;box-shadow:80px 50px 0 -20px #1a1b20}.bl.r{right:-30px;box-shadow:-80px 50px 0 -20px #1a1b20}
.split{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;text-align:left}.split h2{margin:0 0 16px;text-align:left;font-size:clamp(28px,4vw,46px)}.split p{font-size:17px;max-width:480px}
.tsw{position:relative;display:grid;place-items:center}.tsw:before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.35),transparent 65%);filter:blur(20px)}.tsw img{position:relative;width:min(400px,100%);filter:drop-shadow(0 30px 40px rgba(0,0,0,.5));animation:fy 7s ease-in-out infinite}
.tour{position:relative;margin-top:90px}.tour .pill{color:var(--ink)}
.shot{position:relative;max-width:1000px;margin:48px auto 0;border-radius:18px;overflow:hidden;border:1px solid #2a2c33;box-shadow:0 40px 80px -20px rgba(0,0,0,.7)}.shot img{display:block;width:100%}
.mk2{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--y);color:var(--ink);font-weight:800;font-size:12px;display:grid;place-items:center;animation:pu2 2.4s ease-in-out infinite}@keyframes pu2{0%,100%{box-shadow:0 0 0 3px rgba(252,211,77,.35)}50%{box-shadow:0 0 0 10px rgba(252,211,77,0)}}

.card.d{background:#15161B;border-color:#26282F;color:#fff;padding:22px}.card.d h3{font-size:16px;margin:14px 0 6px;color:#fff}.card.d p{color:#a5aab6;font-size:13.5px}

ed","Buy RFIDCheck License — €99","Instant download link delivered right after checkout.","Software","Turnstile / Hardware","Watch a short demo of RFIDCheck in action","Access control","Every pass through your turnstile, accounted for.","RFIDCheck reads what your turnstiles already record and turns each pass into a clear, auditable line: who entered, how long they stayed, what they owe.","Inside the app","A real look at the interface, part by part","Source system / hardware","Pick your hardware or software (e.g. Gantner GAT Relaxx / Net.Access) so the right parser reads your file.","Import log file","Click Import or drag the file in. Supports .csv, .txt, .dat, .xml and .xlsx.","Analysis tabs","Overstay & Penalties, Municipal Subsidy Splitter, Lost Wristbands & Lockers, Data Quality, Tariff Rules and Settings.","Summary cards","Visits, overstays, uncollected fees and visitors still inside, at a glance.","Tariff warning","Flags ticket types without a rule so you can configure them before billing. Fees are estimates from your rules.","Fees by hour","Uncollected fees (€) per hour of the day, so you see exactly when revenue leaks.","Detail table","Wristband, ticket, zone, entry/exit, stay vs. allowed time, fee and locker. Overstays are highlighted in red.","Action bar","Run the analysis, export Excel, CSV or PDF, or generate the Executive report for management.","Executive report","Director-ready in one click. Just copy and paste.","No formatting. No retyping. RFIDCheck writes a clean, plain-text management summary, ready to paste into an email to your boss.","1. Run the analysis","Import your export and click Run analysis. Overstays, fees and subsidies are calculated locally.","2. Click Executive report","One click writes the summary as ready-to-send text: entries, subsidy split and recovered overstays.","3. Copy & paste","Paste it straight into an email, Word or chat. No reformatting, no retyping.","+45m · 2h ticket","Run analysis","Copy","Copied ✓","Copied! ✓","Commercial","Municipal Subsidy","No exit / Blocked","✓ Ready","To","Director","Subject","Shift Audit Report #2026-11","Total Entries","visitors","Subsidy Split (NEAK)","Recovered Overstays","Generated by RFIDCheck","OVERSTAYS","UNCOLLECTED","Lifetime License","RFIDCheck — Turnstile log analysis, offline"],
hu:["Működés","Funkciók","Kompatibilitás","Ár","Licenc vásárlása — €99","Az Ön forgói. Az Ön naplói.","Az Ön bevétele.","Offline asztali rendszer, amely másodpercek alatt feldolgozza a nyers RFID- és forgóajtó-exportokat. Feltárja a be nem szedett időtúllépéseket, szétválasztja az önkormányzati támogatást, és igazgatói jelentést készít – internet és havidíj nélkül.","RFIDCheck megszerzése — €99","Egyszeri fizetés • Örökös Windows-licenc • 100% offline működés","Működés","A nyers forgóexportból igazgatói jelentés","1. Húzza be a hardver-exportot","Exportálja a napi forgalmi fájlt a TermálSoft, Gantner, Metra vagy ZKTeco rendszerből, és húzza az RFIDCheck-be. Nincs Excel-szerkesztés.","2. Azonnali automatikus elemzés","A helyi motor ezredmásodpercek alatt összeveti a be- és kilépési időket, türelmi időket és jegyszabályokat – tiszta pénzügyi jelentés az igazgatónak.","Fő képességek","Kifejezetten a fürdők és uszodák bevételkieséseinek megállítására","Időtúllépés és pótdíj-elemzés","Felismeri a 2 vagy 3 órás jegy időkeretét túllépő vendégeket, és pontosan kiszámolja a be nem szedett díjat.","Önkormányzati támogatás szétválasztó","Másodpercek alatt automatikusan beolvassa és csoportosítja a kereskedelmi belépéseket a támogatási naplókból (NEAK, önkormányzati programok), így csapata órákat spórol a kézi szűrésen.","Elveszett karszalagok és szekrények","Kiszűri az elveszett karszalagokat és a kilépés nélküli látogatásokat, megmutatja a blokkolt szekrényeket.","Hardver és formátumok","Natív támogatás közép-európai és balkáni rendszerekhez","Cserélje a 4 órás táblázatozást 30 másodpercnyi biztonságra.","Havonta 15–20 óra adminisztrációt spórol. Nincs felhő, nincs GDPR-kockázat, 10 nyelvű felület.","Egyszerű árazás","Egyszer fizet. Örökre az öné.","Egyszeri fizetés — előfizetés nélkül","100% offline helyi feldolgozás (internet nélkül)","Korlátlan napi naplófájl (.csv, .txt, .dat, .xml, .xlsx)","Igazgatói Excel-, CSV- és PDF-jelentések","Mind a 10 nyelv és tarifa-előbeállítás benne van","RFIDCheck licenc vásárlása — €99","Azonnali letöltési link a fizetés után.","Szoftver","Forgóajtó / hardver","Nézze meg röviden az RFIDCheck működését","Beléptetés-ellenőrzés","A forgóján áthaladó minden belépés nyomon követve.","Az RFIDCheck azt olvassa be, amit a forgóajtók már rögzítenek, és minden áthaladásból átlátható, ellenőrizhető sort készít: ki lépett be, mennyi ideig maradt, mennyivel tartozik.","Az alkalmazás belülről","Valódi betekintés a felületbe, részről részre","Forrásrendszer / hardver","Válassza ki a hardvert vagy szoftvert (pl. Gantner GAT Relaxx / Net.Access), hogy a megfelelő értelmező olvassa a fájlt.","Naplófájl importálása","Kattintson az Importálásra, vagy húzza be a fájlt. Támogatott: .csv, .txt, .dat, .xml, .xlsx.","Elemzési fülek","Időtúllépés és pótdíj, Önkormányzati támogatás szétválasztó, Elveszett karszalagok és szekrények, Adatminőség, Tarifaszabályok és Beállítások.","Összesítő kártyák","Látogatások, időtúllépések, be nem szedett díjak és bent maradt vendégek – egy pillantásra.","Tarifafigyelmeztetés","Jelzi a szabály nélküli jegytípusokat, hogy számlázás előtt beállíthassa őket. A díjak a szabályokból számolt becslések.","Díjak óránként","A be nem szedett díjak (€) a nap óránkénti bontásában – látni, mikor szivárog a bevétel.","Részletes tábla","Karszalag, jegy, zóna, belépés/kilépés, tartózkodás és megengedett idő, díj és szekrény. Az időtúllépések pirossal kiemelve.","Műveleti sáv","Elemzés futtatása, Excel-, CSV- vagy PDF-export, vagy igazgatói jelentés készítése.","Igazgatói jelentés","Igazgatói jelentés egy kattintással. Csak másolja és illessze be.","Nincs formázás, nincs újragépelés. Az RFIDCheck tiszta, egyszerű szövegű összefoglalót ír, amit egyből beilleszthet a főnökének szóló e-mailbe.","1. Futtassa az elemzést","Importálja az exportot, és kattintson az Elemzés futtatása gombra. Az időtúllépéseket, díjakat és támogatásokat helyben számolja.","2. Kattintson az Igazgatói jelentésre","Egy kattintással elkészül a küldésre kész szöveg: belépések, támogatási bontás és behajtott időtúllépések.","3. Másolás és beillesztés","Illessze be közvetlenül e-mailbe, Wordbe vagy chatbe. Nincs újraformázás, nincs újragépelés.","+45 perc · 2 órás jegy","Elemzés futtatása","Másolás","Másolva ✓","Másolva! ✓","Kereskedelmi","Önkormányzati támogatás","Nincs kilépés / Blokkolva","✓ Kész","Címzett","Igazgató","Tárgy","Műszakjelentés #2026-11","Összes belépés","látogató","Támogatási bontás (NEAK)","Behajtott időtúllépések","Az RFIDCheck készítette","IDŐTÚLLÉPÉSEK","BE NEM SZEDETT","Örökös licenc","RFIDCheck — forgóajtó-naplók elemzése, offline"],
sk:["Ako to funguje","Funkcie","Kompatibilita","Cena","Kúpiť licenciu — €99","Vaše turnikety. Vaše logy.","Vaše tržby.","Offline desktopový systém, ktorý v priebehu sekúnd spracuje surové exporty RFID a turniketov. Odhalí nevybrané prekročenia času, oddelí mestské dotácie a vytvorí reporty pre riaditeľa – bez internetu a mesačných poplatkov.","Získať RFIDCheck — €99","Jednorazová platba • Doživotná licencia pre Windows • 100 % offline","Ako to funguje","Od surových exportov po reporty pre riaditeľa","1. Presuňte export zo zariadenia","Exportujte denný súbor z TermálSoft, Gantner, Metra alebo ZKTeco a presuňte ho do RFIDCheck. Bez úprav v Exceli.","2. Okamžitá automatická analýza","Lokálny motor porovná časy vstupu a výstupu, ochranné lehoty a pravidlá lístkov za milisekundy – prehľadný finančný report.","Hlavné schopnosti","Vytvorené na zastavenie úniku tržieb v kúpeľoch a bazénoch","Prekročenia času a pokuty","Zistí návštevníkov, ktorí prekročili zaplatený limit 2 alebo 3 hodiny, a presne vypočíta nevybrané poplatky.","Rozdelenie dotácií","Za pár sekúnd automaticky spracuje a zoskupí komerčné vstupy z logov dotácií (NEAK, mestské programy) a vášmu tímu ušetrí hodiny ručného filtrovania.","Stratené pásky a skrinky","Izoluje stratené pásky a návštevy bez výstupu a ukáže, ktoré skrinky zostali blokované.","Hardvér a formáty","Natívna podpora systémov strednej Európy a Balkánu","Nahraďte 4 hodiny tabuliek 30 sekundami istoty.","Ušetrite 15–20 hodín administratívy mesačne. Žiadny cloud, žiadne riziko GDPR, rozhranie v 10 jazykoch.","Jednoduchá cena","Zaplaťte raz. Vlastnite navždy.","Jednorazová platba — bez predplatného","100 % offline lokálne spracovanie (bez internetu)","Neobmedzené denné logy (.csv, .txt, .dat, .xml, .xlsx)","Reporty pre riaditeľa v Exceli, CSV a PDF","Všetkých 10 jazykov a predvolieb tarify v cene","Kúpiť licenciu RFIDCheck — €99","Odkaz na stiahnutie ihneď po platbe.","Softvér","Turniket / hardvér","Pozrite si krátku ukážku RFIDCheck v akcii","Kontrola vstupu","Každý prechod cez váš turniket, evidovaný.","RFIDCheck číta to, čo vaše turnikety už zaznamenávajú, a z každého prechodu urobí jasný, auditovateľný riadok: kto vošiel, ako dlho zostal a koľko dlhuje.","Pohľad do aplikácie","Skutočný pohľad na rozhranie, časť po časti","Zdrojový systém / hardvér","Vyberte hardvér alebo softvér (napr. Gantner GAT Relaxx / Net.Access), aby súbor čítal správny parser.","Import súboru logu","Kliknite na Import alebo presuňte súbor. Podporuje .csv, .txt, .dat, .xml a .xlsx.","Analytické karty","Prekročenia a pokuty, Rozdelenie dotácií, Stratené pásky a skrinky, Kvalita dát, Pravidlá tarify a Nastavenia.","Súhrnné karty","Návštevy, prekročenia, nevybrané poplatky a návštevníci stále vnútri na prvý pohľad.","Upozornenie na tarify","Označí typy lístkov bez pravidla, aby ste ich pred fakturáciou nastavili. Poplatky sú odhady podľa vašich pravidiel.","Poplatky podľa hodín","Nevybrané poplatky (€) za každú hodinu dňa, aby ste videli, kedy unikajú tržby.","Detailná tabuľka","Páska, lístok, zóna, vstup/výstup, pobyt vs. povolený čas, poplatok a skrinka. Prekročenia sú zvýraznené červenou.","Panel akcií","Spustite analýzu, exportujte Excel, CSV alebo PDF, alebo vytvorte report pre riaditeľa.","Report pre riaditeľa","Pripravené pre riaditeľa jedným klikom. Stačí skopírovať a vložiť.","Žiadne formátovanie, žiadne prepisovanie. RFIDCheck napíše čistý textový súhrn pre vedenie, ktorý vložíte rovno do e-mailu šéfovi.","1. Spustite analýzu","Importujte export a kliknite na Spustiť analýzu. Prekročenia, poplatky a dotácie sa počítajú lokálne.","2. Kliknite na Report pre riaditeľa","Jedno kliknutie napíše súhrn ako text pripravený na odoslanie: vstupy, rozdelenie dotácií a vymožené prekročenia.","3. Kopírovať a vložiť","Vložte ho priamo do e-mailu, Wordu alebo chatu. Bez preformátovania a prepisovania.","+45 min · lístok na 2 h","Spustiť analýzu","Kopírovať","Skopírované ✓","Skopírované! ✓","Komerčné","Mestská dotácia","Bez výstupu / Blokované","✓ Hotovo","Komu","Riaditeľ","Predmet","Správa o zmene #2026-11","Spolu vstupov","návštevníkov","Rozdelenie dotácií (NEAK)","Vymožené prekročenia","Vytvorené v RFIDCheck","PREKROČENIA","NEVYBRANÉ","Doživotná licencia","RFIDCheck — analýza logov turniketov, offline"],

trola vstupu","Každý průchod vaším turniketem, pod kontrolou.","RFIDCheck čte to, co vaše turnikety už zaznamenávají, a z každého průchodu udělá jasný, auditovatelný řádek: kdo vstoupil, jak dlouho zůstal a kolik dluží.","Pohled do aplikace","Skutečný pohled na rozhraní, část po části","Zdrojový systém / hardware","Vyberte hardware nebo software (např. Gantner GAT Relaxx / Net.Access), aby soubor četl správný parser.","Import souboru logu","Klikněte na Import nebo soubor přetáhněte. Podporuje .csv, .txt, .dat, .xml a .xlsx.","Analytické karty","Překročení a doplatky, Rozdělení dotací, Ztracené pásky a skříňky, Kvalita dat, Pravidla tarifů a Nastavení.","Souhrnné karty","Návštěvy, překročení, nevybrané poplatky a návštěvníci stále uvnitř na první pohled.","Upozornění na tarify","Označí typy vstupenek bez pravidla, abyste je před fakturací nastavili. Poplatky jsou odhady podle vašich pravidel.","Poplatky podle hodin","Nevybrané poplatky (€) za každou hodinu dne, abyste viděli, kdy unikají tržby.","Detailní tabulka","Páska, vstupenka, zóna, vstup/výstup, pobyt vs. povolený čas, poplatek a skříňka. Překročení jsou zvýrazněna červeně.","Panel akcí","Spusťte analýzu, exportujte Excel, CSV nebo PDF, nebo vytvořte report pro ředitele.","Report pro ředitele","Připraveno pro ředitele jedním klikem. Stačí zkopírovat a vložit.","Žádné formátování, žádné přepisování. RFIDCheck napíše čistý textový souhrn pro vedení, který vložíte rovnou do e-mailu šéfovi.","1. Spusťte analýzu","Importujte export a klikněte na Spustit analýzu. Překročení, poplatky a dotace se počítají lokálně.","2. Klikněte na Report pro ředitele","Jedním klikem vznikne souhrn jako text připravený k odeslání: vstupy, rozdělení dotací a vymožená překročení.","3. Kopírovat a vložit","Vložte ho přímo do e-mailu, Wordu nebo chatu. Bez přeformátování a přepisování.","+45 min · vstupenka na 2 h","Spustit analýzu","Kopírovat","Zkopírováno ✓","Zkopírováno! ✓","Komerční","Městská dotace","Bez výstupu / Blokováno","✓ Hotov pl:["Jak to działa","Funkcje","Zgodność","Cena","Kup licencję — €99","Twoje bramki. Twoje logi.","Twój przychód.","Offline’owy system desktopowy, który w kilka sekund przetwarza surowe eksporty RFID i bramek. Wykrywa niepobrane przekroczenia czasu, wydziela dotacje samorządowe i tworzy raporty dla dyrektora – bez internetu i abonamentu.","Pobierz RFIDCheck — €99","Jednorazowa płatność • Dożywotnia licencja Windows • 100% offline","Jak to działa","Od surowych eksportów do raportów dla dyrektora","1. Przeciągnij eksport ze sprzętu","Wyeksportuj dzienny plik z systemu bramek i przeciągnij go do RFIDCheck. Bez ręcznej obróbki w Excelu.","2. Natychmiastowa analiza","Lokalny silnik porównuje czasy wejść i wyjść, okresy tolerancji i zasady biletów w milisekundy – czysty raport finansowy.","Kluczowe możliwości","Stworzone, by zatrzymać ucieczkę przychodów w termach i basenach","Przekroczenia czasu i dopłaty","Wykrywa gości, którzy przekroczyli opłacony limit 2 lub 3 godzin, i dokładnie liczy niepobrane opłaty.","Podział dotacji","W kilka sekund automatycznie analizuje i grupuje wejścia komercyjne z logów dotacji (NEAK, programy samorządowe), oszczędzając zespołowi godziny ręcznego filtrowania.","Zgubione opaski i szafki","Wyłapuje zgubione opaski i wizyty bez wyjścia na koniec zmiany, pokazując zablokowane szafki.","Sprzęt i formaty","Natywna obsługa systemów Europy Środkowej i Bałkanów","Zamień 4 godziny arkuszy na 30 sekund pewności.","Oszczędź 15–20 godzin pracy administracyjnej miesięcznie. Bez chmury, bez ryzyka RODO, interfejs w 10 językach.","Prosta cena","Zapłać raz. Miej na zawsze.","Jednorazowa płatność — bez subskrypcji","100% lokalne przetwarzanie offline (bez internetu)","Nielimitowane dzienne logi (.csv, .txt, .dat, .xml, .xlsx)","Raporty dla dyrektora: Excel, CSV i PDF","Wszystkie 10 języków i presety taryf w cenie","Kup licencję RFIDCheck — €99","Link do pobrania zaraz po zakupie.","Oprogramowanie","Bramka / sprzęt","Zobacz krótką demonstrację RFIDCheck w akcji","Kontrola dostępu","Każde przejście przez Twoją bramkę – policzone.","RFIDCheck odczytuje to, co Twoje bramki już rejestrują, i zamienia każde przejście w czytelną, możliwą do audytu linię: kto wszedł, jak długo został i ile jest winien.","Wewnątrz aplikacji","Prawdziwy wgląd w interfejs, część po części","System źródłowy / sprzęt","Wybierz sprzęt lub oprogramowanie (np. Gantner GAT Relaxx / Net.Access), aby plik odczytał właściwy parser.","Importuj plik logu","Kliknij Importuj lub przeciągnij plik. Obsługuje .csv, .txt, .dat, .xml i .xlsx.","Zakładki analizy","Przekroczenia i dopłaty, Podział dotacji, Zgubione opaski i szafki, Jakość danych, Reguły taryf i Ustawienia.","Karty podsumowania","Wizyty, przekroczenia, niepobrane opłaty i goście wciąż w środku – jednym rzutem oka.","Ostrzeżenie o taryfach","Wskazuje typy biletów bez reguły, aby skonfigurować je przed rozliczeniem. Opłaty to szacunki z Twoich reguł.","Opłaty według godzin","Niepobrane opłaty (€) w każdej godzinie dnia – widzisz dokładnie, kiedy ucieka przychód.","Tabela szczegółów","Opaska, bilet, strefa, wejście/wyjście, pobyt vs. dozwolony czas, opłata i szafka. Przekroczenia podświetlone na czerwono.","Pasek akcji","Uruchom analizę, eksportuj Excel, CSV lub PDF albo wygeneruj raport dla dyrektora.","Raport dla dyrektora","Gotowe dla dyrektora jednym kliknięciem. Wystarczy skopiować i wkleić.","Bez formatowania. Bez przepisywania. RFIDCheck pisze czyste, tekstowe podsumowanie dla zarządu, które wklejasz prosto do e-maila do szefa.","1. Uruchom analizę","Zaimportuj eksport i kliknij Uruchom analizę. Przekroczenia, opłaty i dotacje liczone są lokalnie.","2. Kliknij Raport dla dyrektora","Jedno kliknięcie tworzy podsumowanie jako tekst gotowy do wysłania: wejścia, podział dotacji i odzyskane przekroczenia.","3. Kopiuj i wklej","Wklej prosto do e-maila, Worda lub czatu. Bez formatowania, bez przepisywania.","+45 min · bilet 2 h","Uruchom analizę","Kopiuj","Skopiowano ✓","Skopiowano! ✓","Komercyjne","Do ro:["Cum funcționează","Funcții","Compatibilitate","Preț","Cumpără licența — €99","Turnichetele tale. Logurile tale.","Veniturile tale.","Sistem desktop offline care procesează în secunde exporturile brute RFID și de turnichete. Identifică depășirile necolectate, separă subvențiile municipale și generează rapoarte pentru director – fără internet, fără abonament.","Obține RFIDCheck — €99","Plată unică • Licență Windows pe viață • Execuție 100% offline","Cum funcționează","De la exporturi brute la rapoarte pentru director","1. Trage exportul din echipament","Exportă fișierul zilnic și trage-l în RFIDCheck. Fără formatare în Excel.","2. Analiză automată instantanee","Motorul local compară orele de intrare/ieșire, perioadele de grație și regulile biletelor în milisecunde – raport financiar curat.","Capabilități de bază","Creat pentru a opri pierderile de venit la băi termale și piscine","Depășiri și penalități","Detectează vizitatorii care au depășit limita plătită de 2 sau 3 ore și calculează exact taxele necolectate.","Separarea subvențiilor","Analizează și grupează automat, în câteva secunde, intrările comerciale din jurnalele de subvenții (NEAK, programe municipale), economisind echipei ore de filtrare manuală.","Brățări pierdute și dulapuri","Izolează brățările pierdute și vizitele fără ieșire la finalul turei, arătând dulapurile blocate.","Hardware și formate","Suport nativ pentru sistemele din Europa Centrală și Balcani","Înlocuiește 4 ore de foi de calcul cu 30 de secunde de certitudine.","Economisești 15–20 de ore de muncă administrativă lunar. Fără cloud, fără risc GDPR, interfață în 10 limbi.","Preț simplu","Plătești o dată. Al tău pe vecie.","Plată unică — fără abonamente","Procesare locală 100% offline (fără internet)","Fișiere de log zilnice nelimitate (.csv, .txt, .dat, .xml, .xlsx)","Rapoarte pentru director: Excel, CSV și PDF","Toate cele 10 limbi și presetările de tarife incluse","Cumpără licența RFIDCheck — €99","Link de descărcare imediat după plată.","Software","Turnichet / hardware","Vezi o scurtă demonstrație RFIDCheck în acțiune","Control acces","Fiecare trecere prin turnichetul tău, contabilizată.","RFIDCheck citește ce înregistrează deja turnichetele tale și transformă fiecare trecere într-o linie clară, auditabilă: cine a intrat, cât a rămas, cât datorează.","În interiorul aplicației","O privire reală asupra interfeței, bucată cu bucată","Sistem sursă / hardware","Alege hardware-ul sau software-ul (ex. Gantner GAT Relaxx / Net.Access) pentru ca fișierul să fie citit de parserul potrivit.","Importă fișier de log","Apasă Import sau trage fișierul. Acceptă .csv, .txt, .dat, .xml și .xlsx.","File de analiză","Depășiri și penalități, Separarea subvențiilor, Brățări pierdute și dulapuri, Calitatea datelor, Reguli de tarif și Setări.","Carduri de sumar","Vizite, depășiri, taxe necolectate și vizitatori încă înăuntru, dintr-o privire.","Avertisment tarife","Semnalează tipurile de bilete fără regulă, ca să le configurezi înainte de facturare. Taxele sunt estimări după regulile tale.","Taxe pe oră","Taxe necolectate (€) pe fiecare oră a zilei, ca să vezi exact când se pierd veniturile.","Tabel detaliat","Brățară, bilet, zonă, intrare/ieșire, ședere vs. timp permis, taxă și dulap. Depășirile sunt evidențiate cu roșu.","Bară de acțiuni","Rulează analiza, exportă Excel, CSV sau PDF sau generează raportul pentru director.","Raport pentru director","Gata pentru director cu un singur clic. Doar copiază și lipește.","Fără formatare. Fără retastare. RFIDCheck scrie un rezumat simplu, în text, pentru conducere, gata de lipit într-un e-mail către șef.","1. Rulează analiza","Importă exportul și apasă Rulează analiza. Depășirile, taxele și subvențiile se calculează local.","2. Apasă Raport pentru director","Un clic scrie rezumatul ca text gata de trimis: intrări, separarea subvențiilor și depășiri recuperate.","3. Copiază și lipește","Lipește direct în e-mail, Word sau chat. Fără reformatare, fără retastare.","+45 min · bilet
